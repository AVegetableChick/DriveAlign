# Stage 09 Eval v1 evaluation configuration.
#
# FROZEN as of 2026-10-05 (S09 Step 5), before the official report was
# generated; this is the version whose hash is registered in the S09 plan
# section 4 and quoted by the official m09 report. Metric definitions:
# S09 plan section 3/3.1. All closed enums below are pinned byte-identical
# to contract v5 by unit tests.

status: frozen
eval_version: eval_v1
evaluation_split: test

matching:
  iou_thresholds: [0.3, 0.5, 0.7]
  primary_iou_threshold: 0.5

taxonomies:
  motion_states: [stationary, same_direction, oncoming, crossing]
  speed_actions: [ACCELERATE, KEEP_SPEED, DECELERATE, STOP]
  risk_factors:
    - pedestrian_crossing
    - vehicle_merging
    - lead_vehicle_braking
    - corridor_conflict
    - stationary_obstacle
    - congestion
    - oncoming_traffic
  categories:
    - car
    - truck
    - construction_vehicle
    - bus
    - trailer
    - barrier
    - motorcycle
    - bicycle
    - pedestrian
    - traffic_cone

max_items: 8

bootstrap:
  n_resamples: 2000
  seed: 20261003
  confidence_level: 0.95

counterfactual:
  subset_size: 200
  transforms: [blank, shuffled]
