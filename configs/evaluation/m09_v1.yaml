# Stage 09 M09 v1 evaluation configuration.
#
# PROVISIONAL until the S09 Step 5 freeze (status flips to frozen before the
# official report is generated; only then may m09_report be quoted as the
# frozen Base benchmark). Metric definitions: S09 plan section 3/3.1. All
# closed enums below are pinned byte-identical to contract v5 by unit tests.

status: provisional
m09_version: m09_v1
evaluation_split: test

matching:
  iou_thresholds: [0.3, 0.5, 0.7]
  primary_iou_threshold: 0.5

taxonomies:
  motion_states: [stationary, same_direction, oncoming, crossing]
  speed_actions: [ACCELERATE, KEEP_SPEED, DECELERATE, STOP]
  risk_factors:
    - pedestrian_crossing
    - vehicle_merging
    - lead_vehicle_braking
    - corridor_conflict
    - stationary_obstacle
    - congestion
    - oncoming_traffic
  categories:
    - car
    - truck
    - construction_vehicle
    - bus
    - trailer
    - barrier
    - motorcycle
    - bicycle
    - pedestrian
    - traffic_cone

max_items: 8

bootstrap:
  n_resamples: 2000
  seed: 20261003
  confidence_level: 0.95

counterfactual:
  subset_size: 200
  transforms: [blank, shuffled]
